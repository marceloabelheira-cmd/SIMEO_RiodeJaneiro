<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIMEO — Sistema Integrado de Matrizes Estratégicas e/ou Operacionais</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#e6e6e6;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#111}
a{color:inherit}
/* ===== Palco no estilo "tela do Excel" (escala proporcional) ===== */
.viewport{width:100vw;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:auto;padding-bottom:46px}
.scaler{position:relative;flex:none;box-shadow:0 2px 14px rgba(0,0,0,.18)}
.stage{position:absolute;top:0;left:0;transform-origin:0 0;background:#fff;overflow:hidden}
.abs{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.vt{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.it{font-style:italic}
.b{font-weight:700}
a.btn{text-decoration:none;cursor:pointer;transition:filter .15s,box-shadow .15s}
a.btn:hover,a.btn:focus-visible{filter:brightness(1.2);box-shadow:inset 0 0 0 4px #FFC000;outline:none}
a.btn.light:hover,a.btn.light:focus-visible{filter:brightness(.93)}
svg.layer{position:absolute;left:0;top:0;pointer-events:none}

/* ===== Tela inicial ===== */
.pink{background:#F2DCDB;color:#0000FF}
.maroon{background:#632523;color:#fff;border:2px solid #1a0a0a}
.black{background:#000;color:#fff}
.tan{background:#DDD9C4}
.olive{background:#4A452A;color:#fff}

/* ===== Matriz de Risco ===== */
.mr-cell{position:absolute;border:1px solid #000}
.mr-head{position:absolute;left:0;right:0;top:0;height:32px;border-bottom:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:18px}
.mr-items{position:absolute;left:0;right:0;top:32px;bottom:0;display:flex;flex-direction:column;justify-content:space-around;align-items:center;padding:2px 6px}
.oc{font-style:italic;font-weight:600;font-size:13.5px;color:#111;text-decoration:none;display:inline-flex;align-items:center;gap:8px;padding:1px 6px;border-radius:2px;text-align:center;line-height:1.15}
.oc.red{color:#E00000}
.oc:hover,.oc:focus-visible{background:rgba(0,0,0,.12);text-decoration:underline;outline:none}
.hazid{background:#FF0000;color:#fff;font-style:normal;font-weight:700;font-size:11px;padding:1px 7px;letter-spacing:.3px;border:1px solid #fff}

/* ===== Abas superiores / colunas CCO ===== */
.tab{font-style:italic;font-size:20px;font-weight:600;color:#111;text-decoration:none;padding:2px 22px;height:100%;display:flex;align-items:center}
.tab.blue{color:#0000FF}
.tab:hover,.tab:focus-visible{background:#e2bcbb;outline:none}
.cc{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #333;font-weight:700;font-size:17.5px;line-height:1.35;padding:0 6px;color:#111;text-decoration:none}
a.cc{font-style:italic;cursor:pointer}
a.cc:hover,a.cc:focus-visible{filter:brightness(.88);box-shadow:inset 0 0 0 3px #632523;outline:none}
.emd{position:absolute;display:flex;flex-direction:column;align-items:center;color:#fff;font:600 10px Arial,sans-serif;text-align:center;line-height:1.25}
.emd .ic{width:50px;height:50px;display:flex;align-items:center;justify-content:center}
.emd b{font-size:9.5px;margin:4px 0 10px}
.emd span{opacity:.85;font-size:9.5px;margin-bottom:6px}
.slot{position:absolute;border:2px dashed #9aa;background:repeating-linear-gradient(45deg,#f6f7f8,#f6f7f8 12px,#eef0f2 12px,#eef0f2 24px);display:flex;align-items:center;justify-content:center;text-align:center;color:#667;font:600 20px "Segoe UI",Arial,sans-serif;padding:20px}

/* ===== Matrizes GUT ===== */
.gc{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #6b6b6b;font-size:15.5px;line-height:1.22;padding:2px 5px;cursor:pointer;user-select:none}
.gc:hover{filter:brightness(1.1);box-shadow:inset 0 0 0 2px #333}
.gc.sel{box-shadow:inset 0 0 0 4px #000;font-weight:700}
.gc.w0.sel{box-shadow:inset 0 0 0 4px #777}
.gl{position:absolute;display:flex;align-items:center;justify-content:center;border-top:2px solid #000;border-bottom:2px solid #000}
.gl span{transform:rotate(-45deg);font-weight:700;font-size:23px;letter-spacing:.5px}
.pl{position:absolute;background:#F2DCDB;color:#0000FF;font-style:italic;font-weight:600;font-size:19px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;border:none}
.pl:hover{background:#e2bcbb}
/* ===== POP ===== */
.inc{position:absolute;display:flex;align-items:center;padding-left:4px;font-weight:600;font-size:15px;border:1px solid #000;border-top:none;white-space:nowrap;overflow:hidden;text-decoration:none;color:#111}
a.inc{color:#0000FF;font-style:italic;text-decoration:underline}
a.inc:hover{background:#F2DCDB}

/* ===== Barra de navegação flutuante ===== */
.nav{position:fixed;right:12px;bottom:8px;display:flex;gap:6px;z-index:50}
.nav a{background:rgba(31,73,125,.92);color:#fff;text-decoration:none;font:600 13px "Segoe UI",Arial,sans-serif;padding:7px 12px;border-radius:18px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.nav a:hover{background:#632523}
.rotate{position:fixed;left:0;right:0;top:0;background:#632523;color:#fff;font:600 12px "Segoe UI",Arial,sans-serif;text-align:center;padding:6px;z-index:60;display:none}
@media (orientation:portrait) and (max-width:700px){.rotate.on{display:block}}

/* ===== Telas internas (em construção) ===== */
.page{min-height:100vh;background:#fff;font-family:"Segoe UI",Calibri,Arial,sans-serif}
.p-top{display:flex;flex-wrap:wrap;border-bottom:4px solid #632523}
.p-side{display:flex;flex-direction:column;min-width:190px}
.p-side a{background:#F2DCDB;color:#0000FF;font-style:italic;font-weight:700;text-decoration:none;padding:9px 16px;border-bottom:1px solid #c9a9a8;font-family:Calibri,Carlito,Arial,sans-serif;font-size:17px}
.p-side a:hover{background:#e6c4c3}
.p-title{flex:1;background:#1F3B5F;color:#fff;display:flex;flex-direction:column;justify-content:center;padding:14px 26px;min-width:260px}
.p-title h1{font-size:clamp(20px,3vw,34px);font-weight:700;letter-spacing:.3px}
.p-title small{opacity:.8;font-size:14px;margin-top:4px}
.p-body{max-width:1000px;margin:28px auto;padding:0 18px 80px}
.card{border:1px solid #d6d6d6;border-left:6px solid #632523;border-radius:4px;padding:20px 22px;margin-bottom:18px;background:#fafafa}
.card h2{font-size:18px;color:#632523;margin-bottom:8px}
.card p{line-height:1.5;color:#333}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin-top:6px}
.kv dt{font-weight:700;color:#555}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700}
.chip.T{background:#00B050;color:#fff}.chip.M{background:#FFFF00;color:#111;border:1px solid #c9c900}.chip.N{background:#FF0000;color:#fff}
.chip.ok{background:#00B050;color:#fff}.chip.todo{background:#ddd;color:#555}
.map-group{margin-bottom:22px}
.map-group h3{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:#1F3B5F;border-bottom:2px solid #1F3B5F;padding-bottom:4px;margin-bottom:8px}
.map-group a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 10px;text-decoration:none;border-bottom:1px solid #eee}
.map-group a:hover{background:#F2DCDB}
.progress{height:12px;background:#eee;border-radius:6px;overflow:hidden;margin:8px 0 4px}
.progress div{height:100%;background:#00B050}
</style>
</head>
<body>
<div class="rotate" id="rotate">Gire o aparelho (modo paisagem) para visualizar melhor a tela.</div>
<div id="app"></div>
<div class="nav" id="nav"></div>

<script>
/* =========================================================================
   SIMEO — Cidade do Rio de Janeiro · versão HTML
   Estrutura: cada tela é registrada em SCREENS (id, título, grupo, render).
   Navegação por hash (#/id) → o botão "voltar" do navegador funciona.
   Telas sem render próprio usam o modelo "em construção" (a migrar do Excel).
   ========================================================================= */
const VERSAO = 'v0.5';
const SCREENS = {};
function reg(id, title, group, opts = {}) { SCREENS[id] = { id, title, group, ...opts }; }
function slug(t) { return t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- Registro das telas ---------- */
reg('inicio', 'Tela inicial (SIMEO - figura)', 'Estrutura principal', { ready: true, render: renderHome });
reg('matriz-risco', 'Matriz de Risco com exemplos de ocorrências', 'Matrizes', { ready: true, render: renderRisco });

reg('matriz-decisoria', 'Matriz Decisória', 'Matrizes');
reg('estagio-operacional', 'Estágio Operacional', 'Matrizes');
reg('matriz-gut', 'Matrizes GUT específicas para diversas situações', 'Matriz GUT', { ready: true, render: renderGutHub });
reg('matriz-axr', 'Matriz AxR', 'Matrizes', { sub: 'Atividades x Responsabilidades' });
reg('matriz-comunicacao', 'Matriz de Comunicação', 'Matrizes');
reg('pops', 'POPs', 'Matrizes', { sub: 'Procedimentos Operacionais Padrão' });
reg('matriz-icr-s2id', 'Matriz ICR-S2ID', 'Matrizes', { sub: 'Identificação, Classificação e Registro de Desastres' });

reg('planejamento', 'Planejamento', 'Fases', { sub: 'Ações prévias — anteriores ao desastre/emergência · Prevenção / Mitigação / Preparação' });
reg('gestao-ocorrencia', 'Gestão da Ocorrência', 'Fases', { sub: 'Ações operacionais — no decorrer do incidente/desastre · Resposta / Recuperação' });
reg('eventos-nao-planejados', 'Histórico de Eventos Não Planejados', 'Estrutura principal', { ready: true, render: () => renderList(HIST) });
reg('acoes-planejadas', 'Eventos Planejados (Ações Planejadas)', 'Estrutura principal', { ready: true, render: () => renderList(PLAN) });

reg('cco', 'CCO — Divisões de atuação em um Centro de Operações de Cidades', 'Estrutura principal', { ready: true, render: renderCCO });
reg('cobrade', 'COBRADE', 'Estrutura principal', { ready: true, render: renderCobrade });
reg('funcoes', 'Funções', 'Funções e referências');
reg('simeo-tabela', 'SIMEO - tabela', 'Funções e referências');
reg('consequencias', 'Consequências em: Pessoas, Patrimônio, Meio Ambiente, Imagem', 'Funções e referências');
reg('estrutura-organizacional', 'Estrutura Organizacional e Contatos - PCRJ', 'Funções e referências');
reg('mapa', 'Mapa de telas', 'Estrutura principal', { ready: true, render: renderMapa, hidden: true });

/* ---------- Dados da Matriz de Risco ---------- */
const COLS = [
  { k: 'A', d: 'EXTREMAMENTE REMOTA' }, { k: 'B', d: 'REMOTA' }, { k: 'C', d: 'POUCO PROVÁVEL' },
  { k: 'D', d: 'PROVÁVEL' }, { k: 'E', d: 'FREQUENTE' }];
const ROWS = [
  { n: 5, d: 'CATASTRÓFICA', it: true }, { n: 4, d: 'CRÍTICA', it: true }, { n: 3, d: 'MÉDIA' },
  { n: 2, d: 'MARGINAL' }, { n: 1, d: 'DESPREZÍVEL' }];
const NIVEL = { T: 'TOLERÁVEL', M: 'MODERADO', N: 'NÃO ACEITÁVEL' };
const GRID = { 5: 'MMNNN', 4: 'TMMNN', 3: 'TTMMN', 2: 'TTTMM', 1: 'TTTTM' };
const OCORR = {
  '5A': [{ t: 'Acidente Petroquímico', red: 1, hz: 1 }, { t: 'Acidente na Ponte - aeronave ou navio', hz: 1 }, { t: 'Acidente ou atentado QBRN', hz: 1 }],
  '5B': [{ t: 'Ocorrência grave em Equipamento Estratégico' }, { t: 'Desabamento de edificação grande porte' }, { t: 'Queda de aeronave de grande porte' }],
  '4B': [{ t: 'Ocorrência grave em evento de grande porte' }, { t: 'Onda de Calor de MUITO ALTO IMPACTO' }, { t: 'Chuvas muito Intensas com graves consequências' }],
  '4C': [{ t: 'Incêndio em edificação de grande porte', red: 1 }, { t: 'Acidente rodoviário ou ferroviário GRAVE' }, { t: 'Explosão de Grande Porte' }],
  '3C': [{ t: 'Queda de estrutura - status médio' }, { t: 'Movimento de massa (deslizamento / rolamento)' }, { t: 'Rompimento de tubulação de grande porte' }],
  '3D': [{ t: 'Chuvas Intensas de MÉDIO impacto' }, { t: 'Desabamento e/ou explosão em edificação' }, { t: 'Ocorrência em geral da cidade com status ALTO' }],
  '2C': [{ t: 'Ocorrências com alta complexidade operacional' }, { t: 'Sequestros ou atentados com significativo impacto' }, { t: 'Surto de doença (DENGUE - por exemplo)' }],
  '2D': [{ t: 'Ocorrência de Ressacas do mar' }, { t: 'Chuva na cidade' }, { t: 'Colisão de veículos - com óbito' }],
  '2E': [{ t: 'Incêndio em VP, ou veículo de grande porte (CM / ON) parado, em via importante' }, { t: 'Ocorrências em geral da cidade com status médio' }],
  '1E': [{ t: 'Acidente VP sem vítima - status normal' }, { t: 'Queda de árvore - status normal' }, { t: 'Ocorrências em geral da cidade com status normal' }],
};
// cada ocorrência vira uma tela própria (a migrar)
for (const [cls, list] of Object.entries(OCORR)) {
  const r = +cls[0], c = cls[1], lv = GRID[r]['ABCDE'.indexOf(c)];
  list.forEach(o => {
    o.id = 'oc-' + slug(o.t);
    reg(o.id, o.t, 'Ocorrências (Matriz de Risco)', {
      occ: { cls, nivel: lv, sev: `${r} — ${ROWS.find(x => x.n === r).d}`, freq: `${c} — ${COLS.find(x => x.k === c).d}`, hazid: !!o.hz }
    });
  });
}

/* ---------- Telas de lista: Histórico de Eventos Não Planejados / Eventos Planejados ---------- */
const U = t => `<u>${t}</u>`;
const HIST = {
  tabs: [['SIMEO - figura', 'inicio'], ['MATRIZ DE RISCO', 'matriz-risco'], ['MATRIZ DECISÓRIA', 'matriz-decisoria'], ['AÇÕES PLANEJADAS (Grandes Eventos / Exercícios Simulados / Implosões / entre outros)', 'acoes-planejadas', 1]],
  title: 'HISTÓRICO DE EVENTOS NÃO PLANEJADOS', titleBg: '#632523',
  sub: 'Incidentes, acidentes e desastres ocorridos na cidade nas últimas décadas', subH: 62, gap: 24,
  split: 1047, rowH: 51, pitch: 75, fs: 27, linkColor: '#215967', linkFs: 22, sameBg: false,
  rows: [
    [`HISTÓRICO DE ${U('DESASTRES TECNOLÓGICOS')} MARCANTES NA CIDADE`, 'Grandes Desastres Tecnológicos Marcantes para a cidade - clique aqui', 'hist-desastres-tecnologicos', 'Histórico de Desastres Tecnológicos marcantes na cidade'],
    [`HISTÓRICO DE ${U('CHUVAS INTENSAS')} MARCANTES NA CIDADE`, 'Chuvas Intensas - clique aqui', 'hist-chuvas-intensas', 'Histórico de Chuvas Intensas marcantes na cidade'],
    [`HISTÓRICO DE ${U('RESSACAS MARÍTIMAS')} MARCANTES NA CIDADE`, 'Grandes Ressacas na cidade - clique aqui', 'hist-ressacas', 'Histórico de Ressacas Marítimas marcantes na cidade'],
    [`HISTÓRICO DE ${U('ONDAS DE CALOR')} NA CIDADE`, 'Ondas de Calor - clique aqui', 'hist-ondas-calor', 'Histórico de Ondas de Calor na cidade'],
    [`HISTÓRICO DE ${U('OCORRÊNCIAS GRAVES EM EVENTOS DE GRANDE PORTE')} NA CIDADE`, 'Ocorrências em eventos de grande porte - clique aqui', 'hist-eventos-grande-porte', 'Histórico de ocorrências graves em eventos de grande porte'],
    [`HISTÓRICO DE ${U('OCORRÊNCIAS GRAVES EM EQUIPAMENTOS ESTRATÉGICOS')} NA CIDADE`, 'Ocorrências em equipamentos estratégicos - clique aqui', 'hist-equipamentos-estrategicos', 'Histórico de ocorrências graves em equipamentos estratégicos'],
    [`HISTÓRICO DE ${U('SEQUESTROS OU ATENTADOS')} COM IMPACTO SIGNIFICATIVO NA CIDADE`, 'Sequestros ou atentados com significativo impacto - clique aqui', 'hist-sequestros-atentados', 'Histórico de sequestros ou atentados com impacto significativo'],
    ['EXEMPLO DE DETALHAMENTO DE DESASTRE DE CHUVA INTENSA', 'MATRIZ AxR DO DESASTRES DE 13/01/24 - clique aqui', 'axr-desastre-13-01-24', 'Matriz AxR do desastre de 13/01/24', { lb: '#C4BD97' }],
    [`${U('CALENDÁRIOS COM VÁRIOS DADOS')} <span style="font-weight:600">(chuvas, vento, sirenes, ressaca) - 2023 a 2025</span>`, 'CALENDÁRIOS 2023, 2024 e 2025 com vários dados - clique aqui', 'calendarios-2023-2025', 'Calendários 2023, 2024 e 2025 (chuvas, vento, sirenes, ressaca)', { lb: '#4A452A', lc: '#fff' }],
  ]
};
const PLAN = {
  tabs: [['SIMEO - figura', 'inicio'], ['MATRIZ DE RISCO', 'matriz-risco'], ['HISTÓRICO DE EVENTOS NÃO PLANEJADOS (Acidentes, Incidentes e Desastres)', 'eventos-nao-planejados']],
  title: 'EVENTOS PLANEJADOS', titleBg: '#006400',
  sub: 'Eventos Esportivos e/ou Culturais de GRANDE MAGNITUDE ou Ações Operacionais como Exercícios Simulados / Implosões ou similares<br>precisam de uma série de ações prévias integradas e coordenadas entre os mais diversos órgãos envolvidos (direta ou indiretamente)', subH: 96, gap: 24,
  split: 1075, rowH: 61, pitch: 110, fs: 27, linkColor: '#0000FF', linkFs: 20, sameBg: true,
  rows: [
    [`HISTÓRICO DE ${U('GRANDES EVENTOS')} MARCANTES NA CIDADE`, 'Grandes Eventos Marcantes para a cidade - clique aqui', 'grandes-eventos-marcantes', 'Grandes Eventos marcantes na cidade', { lb: '#D9D9D9' }],
    [`REALIZAÇÃO DE ${U('IMPLOSÕES')} NA CIDADE (Perimetral, Gama Filho etc)`, 'HISTÓRICO DE IMPLOSÕES - clique aqui', 'historico-implosoes', 'Histórico de Implosões na cidade', { lb: '#BFBFBF' }],
    [`TIPOS DE ${U('EXERCÍCIOS SIMULADOS')} REALIZADOS NA CIDADE`, 'Exercícios Simulados Realizados - clique aqui', 'exercicios-simulados', 'Exercícios Simulados realizados na cidade', { lb: '#D9D9D9' }],
    [`REGISTRO E ACOMPANHAMENTO DE ${U('EVENTOS NA CIDADE')}`, 'Planilha de Planejamento de Eventos - clique aqui', 'planilha-planejamento-eventos', 'Planilha de Planejamento de Eventos', { lb: '#BFBFBF' }],
    [`HISTÓRICO DE PARTICIPAÇÃO EM ${U('EVENTOS DE RRD')} RELEVANTES`, 'Histórico de Eventos de RRD com participação de integrantes da DC - clique aqui', 'eventos-rrd', 'Eventos de RRD com participação de integrantes da DC', { lb: '#D9D9D9' }],
    ['EXEMPLO DE PLANEJAMENTO E OPERAÇÃO DE UM GRANDE SHOW NA CIDADE', 'DETALHES DO PLANEJAMENTO E OPERAÇÃO DO SHOW DA MADONNA - clique aqui', 'show-madonna', 'Planejamento e operação do show da Madonna', { lb: '#C4BD97' }],
  ]
};
HIST.rows.forEach(r => reg(r[2], r[3], 'Eventos Não Planejados'));
PLAN.rows.forEach(r => reg(r[2], r[3], 'Eventos Planejados'));

/* ---------- CCO — Divisões de atuação ---------- */
const CCO_COLS = [
  { t: 'PREVENÇÃO', hb: '#17375E', ib: '#C5D9F1', ih: 76, items: [['MATRIZ DE RISCO', 'matriz-risco'], ['MATRIZ AxR PARA CHUVAS INTENSAS'], ['HAZID_MAE - análise de eventos'], ['EQUIPAMENTOS ESTRATÉGICOS - relação e nível de relevância'], ['MATRIZ DE PROBLEMAS INTEGRADOS']] },
  { t: 'PROTOCOLOS', hb: '#000', ib: '#BFBFBF', ih: 76, items: [['FLUXO DE FUNÇÕES DE COORDENAÇÃO'], ['PROTOCOLO DE INCIDENTE E DESASTRES'], ['PLANILHA DE CONTROLE DE OCORRÊNCIAS'], ['PROTOCOLO DE INCIDENTES EM EVENTOS'], ['MATRIZ AxR PARA OCORRÊNCIAS EM GERAL'], ['DEMAIS PROTOCOLOS / PROCEDIMENTOS DE OPERAÇÃO'], ['ENVIO DE ALERTAS', null, 0, 38]] },
  { t: 'DADOS', it: 1, id: 'cco-dados', hb: '#31859C', ib: '#B7DEE8', ih: 38, fs: 16, items: [['COBRADE - DESASTRES NATURAIS', 'cobrade-dinamica-naturais'], ['COBRADE - DESASTRES TECNOLÓGICOS', 'cobrade-dinamica-tecnologicos'], ['ROTAS - Waze e Google Maps'], ['ESCOLAS', null, 1], ['HOSPITAIS E POSTOS DE SAÚDE', null, 1], ['OBRAS', null, 1], ['WAZE', null, 1], ['RECURSOS GPS', null, 1], ['ÁRVORES E PRAÇAS', null, 1], ['PONTOS DE APOIO', null, 1], ['ÔNIBUS', null, 1], ['RADAR METEOROLÓGICO', null, 1], ['IOT SENSORES', null, 1]] },
  { t: 'TOMADA DE<br>DECISÃO', hb: '#FFC000', ib: '#FFFFCC', ih: 76, items: [['MATRIZ DECISÓRIA - CONDIÇÕES METEOROLÓGICAS'], ['MATRIZ DECISÓRIA - MOBILIDADE'], ['MATRIZ DECISÓRIA - OCORRÊNCIAS'], ['MATRIZ DECISÓRIA - EVENTOS'], ['MATRIZ DECISÓRIA - OUTROS ÍNDICES'], ['MATRIZ DECISÓRIA - GERAL']] },
  { t: 'RESPOSTA', hb: '#FF0000', ib: '#E6B8B7', ih: 76, items: [['MATRIZ DE IMPACTO PARA CHUVAS INTENSAS'], ['MATRIZ DE IMPACTO PARA DESASTRES EM GERAL'], ['MATRIZ DE IMPACTO PARA DENGUE'], ['MATRIZ DE IMPACTO PARA ONDA DE CALOR'], ['MATRIZ DE AÇÃO PARA MUDANÇA DE ESTÁGIO']] },
  { t: 'RECUPERAÇÃO', hb: '#604A7B', ib: '#CCC0DA', ih: 228, items: [['FIDE'], ['FORMULÁRIO DA MATRIZ DE IMPACTO']] },

const GUT_STATE = {};
function gutState(id) { return GUT_STATE[id] || (GUT_STATE[id] = { w: [...GUT[id].w], s: [...GUT[id].s] }); }
function gutSet(id, r, c) { const st = gutState(id); st.s[r] = st.s[r] === c + 1 ? null : c + 1; refresh(); }
function gutPeso(id, r) { const st = gutState(id); st.w[r] = (st.w[r] + 1) % 4; refresh(); }
function gutReset(id) { delete GUT_STATE[id]; refresh(); }
function gutValor(st) { let n = 0, d = 0; st.s.forEach((v, i) => { if (v && st.w[i]) { n += v * st.w[i]; d += st.w[i]; } }); return d ? n / d : 0; }

/* ---------- Utilitários de desenho ---------- */
function box(x, y, w, h, cls, html, href, style = '') {
  const st = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;${style}`;
  return href
    ? `<a class="abs btn ${cls}" href="#/${href}" style="${st}">${html}</a>`
    : `<div class="abs ${cls}" style="${st}">${html}</div>`;
}
// seta dupla "em bloco" (verde) entre dois pontos
function blockArrow(x1, y1, x2, y2, sw = 11, hw = 25, hl = 34) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
  const b1 = [x1 + ux * hl, y1 + uy * hl], b2 = [x2 - ux * hl, y2 - uy * hl];
  const P = (p, s) => `${(p[0] + nx * s).toFixed(1)},${(p[1] + ny * s).toFixed(1)}`;
  const pts = [`${x1},${y1}`, P(b1, hw), P(b1, sw), P(b2, sw), P(b2, hw), `${x2},${y2}`, P(b2, -hw), P(b2, -sw), P(b1, -sw), P(b1, -hw)];
  return `<polygon points="${pts.join(' ')}" fill="#4F6228" stroke="#385D8A" stroke-width="2.5" stroke-linejoin="round"/>`;
}
const arrowSvg = dir => `<svg width="30" height="26" viewBox="0 0 30 26" style="flex:none"><polygon fill="#fff" points="${dir < 0 ? '0,13 13,0 13,7 30,7 30,19 13,19 13,26' : '30,13 17,0 17,7 0,7 0,19 17,19 17,26'}"/></svg>`;

  RESSACAS.forEach(([d, ds, r, u]) => {
    const hh = RH - (+d.slice(6) < 2018 || d === 'DIVERSOS' ? 6 : 0);
    h += cell(0, y, hh, `<span style="font-size:13.5px">${d}</span>`);
    if (ds[0] === '*') { const [t, id] = ds.slice(1).split('|'); h += box(X[1], y, X[2] - X[1], hh, 'light it b', `<span style="font-size:13.5px;color:#0000FF">${t}</span>`, id, 'border:1px solid #444'); }
    else h += cell(1, y, hh, `<span style="font-size:13.5px;line-height:1.35">${ds}</span>`);
    h += cell(2, y, hh, `<span style="font-size:13px;font-weight:600">${r}</span>`);
    const fs = u.length > 130 ? 9 : u.length > 105 ? 10 : u.length > 80 ? 11.5 : 12.5;
    h += `<div class="abs" style="left:641px;top:${y}px;width:629px;height:${hh}px;border:1px solid #444;font-family:Arial,sans-serif;font-size:${fs}px;line-height:1.35;word-break:break-all;padding:0 6px">${urlLinks(u)}</div>`;
    y += hh;
  });
  return stage(W, y + 8, h);
}

/* =========================================================================
   OCORRÊNCIAS GRAVES EM EVENTOS DE GRANDE PORTE
   ========================================================================= */
const OC_EVENTOS = [
  ['10/03/2024', 'Jovem sofre descarga elétrica em evento (Wanna Be Tour) no RIOCENTRO'],
  ['21/11/2023', 'Confusão no jogo Brasil e Argentina no Maracanã'],

  ['26/08/2023', 'Furtos em massa em Show do Alok em Copacabana'],
  ['21/04/2022', 'Menina vai a óbito em acidente no Sambódromo (Carro Alegórico)'],
  ['26/02/2017', 'Acidente com carro alegórico deixa 20 feridos (Desfile na Sapucaí)'],
  ['28/07/2013', 'evento alterado na JMJ devido à chuva e alagamento (mudança de Guaratiba - Campus Fidei para Copacabana)'],
  ['2007', 'final do beisebal do Pan 2007 cancelado devido à chuva e alagamento'],
];
Object.assign(SCREENS['hist-eventos-grande-porte'], { ready: true, render: renderOcEventos, title: 'Ocorrências graves em eventos de grande porte' });
function renderOcEventos() {
  let h = tabs([['SIMEO - figura', 'inicio', 1], ['MATRIZ DE RISCO', 'matriz-risco', 1], ['PROTOCOLO DE INCIDENTES EM EVENTOS', 'protocolo-de-incidentes-em-eventos', 1]], 0, 0, 1300, 24);
  h += box(6, 56, 196, 45, 'b', '<span style="font-size:17px;color:#fff">ANO</span>', null, 'background:#366092;border:1px solid #000');
  h += box(202, 56, 1094, 45, 'b', '<span style="font-size:17px;color:#fff">RELAÇÃO DOS EVENTOS IDENTIFICADOS</span>', null, 'background:#366092;border:1px solid #000');
  OC_EVENTOS.forEach(([d, t], i) => {
    const y = 101 + i * 67;
    h += box(6, y, 196, 67, '', `<span style="font-size:17px">${d}</span>`, null, 'border:1px solid #000');
    h += box(202, y, 1094, 67, 'b', `<span style="font-size:21px">${t}</span>`, null, 'border:1px solid #000');
  });
  return stage(1310, 101 + OC_EVENTOS.length * 67 + 10, h);
}

/* =========================================================================
   TELA PADRÃO "EM CONSTRUÇÃO" (conteúdo a migrar do Excel)
   ========================================================================= */
function renderPlaceholder(sc) {
  let info = '';
  if (sc.occ) {
    const o = sc.occ;
    info = `<div class="card"><h2>Classificação na Matriz de Risco</h2>
      <dl class="kv">
        <dt>Classe</dt><dd><span class="chip ${o.nivel}">${o.cls} ${NIVEL[o.nivel]}</span></dd>
        <dt>Severidade / gravidade</dt><dd>${o.sev}</dd>
        <dt>Frequência / probabilidade</dt><dd>${o.freq}</dd>
        ${o.hazid ? '<dt>Indicador</dt><dd><span class="hazid">HAZID</span></dd>' : ''}
      </dl></div>`;
  }
  return `<div class="page">
    <div class="p-top">
      <div class="p-side"><a href="#/inicio">SIMEO - figura</a><a href="#/matriz-risco">Matriz de Risco</a><a href="#/mapa">Mapa de telas</a></div>
      <div class="p-title"><h1>${esc(sc.title.toUpperCase())}</h1>${sc.sub ? `<small>${esc(sc.sub)}</small>` : ''}<small>${esc(sc.group)}</small></div>
    </div>
    <div class="p-body">
      ${info}
      <div class="card" style="border-left-color:#7F7F7F">
        <h2 style="color:#555">Tela em construção</h2>
        <p>Conteúdo a ser migrado da versão em Excel do SIMEO. A estrutura de navegação desta tela já está pronta: basta inserir o conteúdo.</p>
      </div>
    </div></div>`;
}

/* =========================================================================
   MAPA DE TELAS (acompanhamento da migração)
   ========================================================================= */
function renderMapa() {
  const list = Object.values(SCREENS).filter(s => !s.hidden);
  const ok = list.filter(s => s.ready).length;
  const groups = {};
  list.forEach(s => (groups[s.group] = groups[s.group] || []).push(s));
  return `<div class="page">
    <div class="p-top">
      <div class="p-side"><a href="#/inicio">SIMEO - figura</a><a href="#/matriz-risco">Matriz de Risco</a></div>
      <div class="p-title"><h1>MAPA DE TELAS</h1><small>SIMEO — Cidade do Rio de Janeiro · ${VERSAO}</small></div>
    </div>
    <div class="p-body">
      <div class="card"><h2>Andamento da migração</h2>
        <div class="progress"><div style="width:${(ok / list.length * 100).toFixed(1)}%"></div></div>
        <p>${ok} de ${list.length} telas com conteúdo (${(ok / list.length * 100).toFixed(0)}%).</p></div>
      ${Object.entries(groups).map(([g, arr]) => `<div class="map-group"><h3>${esc(g)} (${arr.length})</h3>
        ${arr.map(s => `<a href="#/${s.id}"><span>${esc(s.title)}${s.occ ? ` <span class="chip ${s.occ.nivel}">${s.occ.cls}</span>` : ''}</span>
          <span class="chip ${s.ready ? 'ok' : 'todo'}">${s.ready ? 'pronta' : 'a migrar'}</span></a>`).join('')}</div>`).join('')}
    </div></div>`;
}

/* =========================================================================
   Motor: palco escalável + roteador
   ========================================================================= */
function stage(W, H, inner, fitW) {
  return `<div class="viewport"${fitW ? ' style="align-items:flex-start"' : ''}><div class="scaler" data-w="${W}" data-h="${H}"${fitW ? ' data-fw="1"' : ''}><div class="stage" style="width:${W}px;height:${H}px">${inner}</div></div></div>`;
}
function fit() {
  const sc = document.querySelector('.scaler');
  document.getElementById('rotate').classList.toggle('on', !!sc);
  if (!sc) return;
  const W = +sc.dataset.w, H = +sc.dataset.h;
  const k = (sc.dataset.fw ? Math.min(innerWidth / W, 1.15) : Math.min(innerWidth / W, (innerHeight - 50) / H)) * 0.99;
  sc.style.width = W * k + 'px'; sc.style.height = H * k + 'px';
  sc.firstElementChild.style.transform = `scale(${k})`;
}
let CUR = 'inicio';
function refresh() { const sc = SCREENS[CUR]; document.getElementById('app').innerHTML = sc.render ? sc.render(sc) : renderPlaceholder(sc); fit(); }
function route() {
  const id = (location.hash.replace(/^#\/?/, '') || 'inicio');
  const sc = SCREENS[id] || SCREENS.inicio; CUR = sc.id;
  document.getElementById('app').innerHTML = sc.render ? sc.render(sc) : renderPlaceholder(sc);
  document.title = `SIMEO — ${sc.title}`;
  document.getElementById('nav').innerHTML = sc.id === 'inicio'
    ? `<a href="#/mapa">☰ Mapa de telas</a>`
    : `<a href="javascript:history.back()">← Voltar</a><a href="#/inicio">⌂ Tela inicial</a><a href="#/mapa">☰ Mapa</a>`;
  scrollTo(0, 0); fit();
}
addEventListener('hashchange', route);
addEventListener('resize', fit);
route();
</script>
